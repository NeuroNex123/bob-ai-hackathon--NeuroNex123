submission:
  title: "Drug Safety Signal Detector & Regulatory Submission Readiness Checker"

  problem_statement: >
    Pharmaceutical safety teams face a time-consuming and error-prone process
    when reviewing large volumes of adverse event reports, identifying potential
    drug safety signals, and checking whether regulatory submissions contain all
    required information. Manual analysis can delay signal detection and increase
    the risk of missing important safety evidence or submission gaps.

  solution_summary: >
    We built an AI-powered platform that analyzes adverse event and drug-safety
    data to identify potential safety signals, prioritize concerning patterns,
    and assess regulatory submission readiness. The solution combines automated
    signal detection with an intelligent readiness checker that highlights missing,
    incomplete, or potentially inconsistent information before submission.

  key_features:
    - "AI-powered detection and prioritization of potential drug safety signals"
    - "Automated analysis of adverse event reports and safety patterns"
    - "Regulatory submission readiness assessment with missing-information detection"
    - "Risk-based prioritization of signals and regulatory issues for review"
    - "Explainable results showing the evidence and reasoning behind detected signals"

  tech_stack:
    languages:
      - "Python"
    frameworks:
      - "FastAPI"
      - "React"
    ibm_technologies:
      - "watsonx.ai"
    databases:
      - "PostgreSQL"
    other:
      - "REST API"
      - "Docker"
      - "JSON/CSV data processing"

  what_we_are_most_proud_of: >
    We are most proud of combining two critical pharmaceutical workflows into
    one intelligent solution: early drug safety signal detection and regulatory
    submission readiness checking. Instead of simply flagging potential issues,
    the platform prioritizes findings and provides understandable evidence that
    can help safety and regulatory teams focus their expert review where it
    matters most.

  known_limitations: >
    The current solution is a hackathon prototype and should support, rather than
    replace, qualified pharmacovigilance and regulatory professionals. Detection
    accuracy depends on the quality and completeness of the available data, and
    regulatory requirements can vary by jurisdiction, product, and submission
    type. Additional validation with real-world pharmacovigilance datasets and
    regulatory workflows would be required before production deployment.

